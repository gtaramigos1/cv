<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Σύνδεση</title>
  <link rel="stylesheet" href="/pos.css">
  <style>
    body { align-items: center; justify-content: center; overflow: auto; padding: 16px; }
    .login { width: min(340px, 100%); display: flex; flex-direction: column; gap: 18px; align-items: stretch; text-align: center; }
    .login h1 { margin: 0; font-size: 1.5rem; }
    .login p { margin: 0; color: var(--muted); }
    .dots { display: flex; justify-content: center; gap: 12px; min-height: 22px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); }
    .dot.on { background: var(--text); border-color: var(--text); }
    .dots.shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .error { color: var(--late); font-weight: 700; min-height: 1.4em; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pad button {
      border: 0; border-radius: 12px; background: var(--panel-2); font-size: 1.6rem; font-weight: 700;
      height: 68px; cursor: pointer; color: var(--text);
    }
    .pad button:active { background: var(--panel-3); transform: scale(0.97); }
    .pad .ok { background: var(--ok); color: #fff; font-size: 1.1rem; }
    .pad .ok:disabled { opacity: 0.4; }
    .pad .back { font-size: 1.3rem; }
  </style>
</head>
<body>
  <main class="login">
    <div>
      <h1>Kitchen Display</h1>
      <p>Πληκτρολόγησε το PIN σου</p>
    </div>
    <div class="dots" id="dots" aria-live="polite"></div>
    <div class="error" id="error"></div>
    <div class="pad" id="pad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <button class="back" data-back aria-label="Διαγραφή">⌫</button><button data-d="0">0</button>
      <button class="ok" data-ok disabled>Είσοδος</button>
    </div>
  </main>
  <script>
    (() => {
      const HOME = { admin: '/', waiter: '/pos', kitchen: '/' };
      const next = new URLSearchParams(location.search).get('next');
      // Μόνο εσωτερικές διαδρομές (όχι //άλλο-site).
      const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;
      let pin = '';
      let busy = false;
      const dots = document.getElementById('dots');
      const error = document.getElementById('error');
      const ok = document.querySelector('[data-ok]');

      function render() {
        const n = Math.max(4, pin.length);
        dots.innerHTML = Array.from({ length: n }, (_, i) => `<span class="dot ${i < pin.length ? 'on' : ''}"></span>`).join('');
        ok.disabled = pin.length < 4 || busy;
      }
      function press(d) {
        if (busy) return;
        error.textContent = '';
        if (d === 'back') pin = pin.slice(0, -1);
        else if (pin.length < 8) pin += d;
        render();
      }
      async function submit() {
        if (pin.length < 4 || busy) return;
        busy = true;
        render();
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Σφάλμα σύνδεσης');
          location.href = safeNext || HOME[data.user.role] || '/';
        } catch (e) {
          error.textContent = e.message;
          dots.classList.remove('shake');
          void dots.offsetWidth;
          dots.classList.add('shake');
          pin = '';
          busy = false;
          render();
        }
      }
      document.getElementById('pad').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.ok !== undefined) submit();
        else if (b.dataset.back !== undefined) press('back');
        else press(b.dataset.d);
      });
      document.addEventListener('keydown', (e) => {
        if (/^\d$/.test(e.key)) press(e.key);
        else if (e.key === 'Backspace') press('back');
        else if (e.key === 'Enter') submit();
      });
      render();
    })();
  </script>
</body>
</html>
