<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Χρήστες</title>
  <link rel="stylesheet" href="/pos.css">
  <style>
    body { overflow: hidden; }
    .page { flex: 1; overflow-y: auto; padding: 20px; }
    .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .page-head h1 { margin: 0; font-size: 1.4rem; }
    .hint { color: var(--muted); margin: 0; }
    .users { display: flex; flex-direction: column; gap: 8px; }
    .user-row {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
    }
    .user-row.off { opacity: 0.55; }
    .user-row .name { font-weight: 700; font-size: 1.05rem; }
    .user-row .meta { color: var(--muted); font-size: 0.9rem; }
    .role { border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700; background: var(--panel-3); white-space: nowrap; }
    .role.admin { background: var(--rush); color: #fff; }
    .role.waiter { background: var(--accent); color: #fff; }
    .role.kitchen { background: var(--warn); color: #1a1300; }
    .user-row .btn { min-height: 40px; padding: 8px 14px; }
    .form { display: flex; flex-direction: column; gap: 12px; }
    .form label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .form .big-input { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
    .form .switch { flex-direction: row; align-items: center; gap: 8px; text-transform: none; font-size: 1rem; color: var(--text); letter-spacing: 0; }
    .form .switch input { width: 20px; height: 20px; accent-color: var(--ok); }
    .form-error { color: var(--late); font-weight: 600; min-height: 1.2em; }
    @media (max-width: 600px) {
      .page { padding: 12px; }
      .user-row { grid-template-columns: minmax(0, 1fr) auto; }
      .user-row .role { grid-row: 1; grid-column: 2; }
      .user-row .btn { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>Χρήστες</strong>
    <nav class="admin-nav" id="adminNav"></nav>
  </header>

  <main class="page">
    <div class="wrap">
      <div class="page-head">
        <p class="hint">Κάθε χρήστης μπαίνει με το δικό του PIN. Ο <b>σερβιτόρος</b> περνά παραγγελίες, η <b>κουζίνα</b> βλέπει μόνο τις οθόνες, ο <b>διαχειριστής</b> έχει πρόσβαση παντού.</p>
        <button class="btn primary" id="addBtn">+ Νέος χρήστης</button>
      </div>
      <div class="users" id="users"></div>
    </div>
  </main>

  <div class="overlay hidden" id="dialog">
    <form class="dialog form" id="form" autocomplete="off">
      <h2 id="formTitle">Νέος χρήστης</h2>
      <label>Όνομα <input class="big-input" id="fName" maxlength="40" placeholder="π.χ. Μαρία"></label>
      <label>Ρόλος
        <div class="seg" id="fRole">
          <button type="button" data-role="waiter">Σερβιτόρος</button>
          <button type="button" data-role="kitchen">Κουζίνα</button>
          <button type="button" data-role="admin">Διαχειριστής</button>
        </div>
      </label>
      <label><span id="pinLabel">PIN (4–8 ψηφία)</span>
        <input class="big-input" id="fPin" inputmode="numeric" pattern="\d*" maxlength="8" placeholder="π.χ. 4821"></label>
      <label class="switch hidden" id="activeRow"><input type="checkbox" id="fActive"> Ενεργός</label>
      <div class="form-error" id="formError"></div>
      <div class="dialog-actions">
        <button class="btn ghost" type="button" id="cancelBtn">Άκυρο</button>
        <button class="btn primary" type="submit" id="submitBtn">Αποθήκευση</button>
      </div>
    </form>
  </div>

  <script src="/common.js"></script>
  <script>
    (() => {
      const { esc, api, toast } = KDS;
      const $ = (id) => document.getElementById(id);
      let users = [];
      let roles = {};
      let meId = null;
      let editing = null; // null = νέος χρήστης
      let role = 'waiter';

      function render() {
        $('users').innerHTML = users.map((u) => `
          <div class="user-row ${u.active ? '' : 'off'}">
            <div><div class="name">${esc(u.name)}${u.id === meId ? ' <span class="meta">(εσύ)</span>' : ''}</div>
              <div class="meta">${u.active ? 'Ενεργός' : 'Ανενεργός'}</div></div>
            <span class="role ${u.role}">${esc(roles[u.role] || u.role)}</span>
            <button class="btn ghost" data-edit="${u.id}">Επεξεργασία</button>
          </div>`).join('') || '<p class="hint">Δεν υπάρχουν χρήστες.</p>';
      }

      function setRole(r) {
        role = r;
        for (const b of $('fRole').querySelectorAll('button')) b.classList.toggle('on', b.dataset.role === r);
      }

      function open(user) {
        editing = user;
        $('formTitle').textContent = user ? `Επεξεργασία: ${user.name}` : 'Νέος χρήστης';
        $('fName').value = user ? user.name : '';
        setRole(user ? user.role : 'waiter');
        $('fPin').value = '';
        $('pinLabel').textContent = user ? 'Νέο PIN (άφησέ το κενό για να μην αλλάξει)' : 'PIN (4–8 ψηφία)';
        $('activeRow').classList.toggle('hidden', !user);
        $('fActive').checked = user ? user.active : true;
        $('formError').textContent = '';
        $('dialog').classList.remove('hidden');
        $('fName').focus();
      }
      const close = () => $('dialog').classList.add('hidden');

      $('fRole').addEventListener('click', (e) => {
        const b = e.target.closest('[data-role]');
        if (b) setRole(b.dataset.role);
      });
      $('addBtn').addEventListener('click', () => open(null));
      $('cancelBtn').addEventListener('click', close);
      $('dialog').addEventListener('click', (e) => { if (e.target.id === 'dialog') close(); });
      $('users').addEventListener('click', (e) => {
        const b = e.target.closest('[data-edit]');
        if (b) open(users.find((u) => u.id === Number(b.dataset.edit)));
      });

      $('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pin = $('fPin').value.trim();
        if (!$('fName').value.trim()) { $('formError').textContent = 'Συμπλήρωσε όνομα'; return; }
        if ((!editing || pin) && !/^\d{4,8}$/.test(pin)) { $('formError').textContent = 'Το PIN πρέπει να έχει 4 έως 8 ψηφία'; return; }
        const body = { name: $('fName').value.trim(), role };
        if (pin) body.pin = pin;
        if (editing) body.active = $('fActive').checked;
        $('submitBtn').disabled = true;
        try {
          if (editing) await api('PATCH', `/api/admin/users/${editing.id}`, body);
          else await api('POST', '/api/admin/users', body);
          close();
          toast(editing ? 'Ο χρήστης ενημερώθηκε' : 'Ο χρήστης δημιουργήθηκε', 'ok', 3000);
          // Αν άλλαξε το δικό μας PIN ή ρόλος, η συνεδρία έληξε → η load() οδηγεί στη σύνδεση.
          await load();
        } catch (err) {
          $('formError').textContent = err.message;
        } finally {
          $('submitBtn').disabled = false;
        }
      });

      async function load() {
        const data = await api('GET', '/api/admin/users');
        users = data.users;
        roles = data.roles;
        meId = data.me;
        render();
      }

      KDS.adminNav($('adminNav'));
      load().catch((e) => toast(`Σφάλμα: ${e.message}`, 'err'));
    })();
  </script>
</body>
</html>
